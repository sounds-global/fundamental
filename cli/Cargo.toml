[package]
name = "fundamental_cli"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line tool (fun) for the Fundamental framework: config validation, migrations, and developer operations."

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bin]]
name = "fun"
path = "src/main.rs"

[dependencies]
fundamental = { workspace = true, features = ["seed", "build", "authz-service"] }
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
fundamental_manifest = { workspace = true, features = ["edit", "ledger"] }
fundamental_messages_build.workspace = true
toml.workspace = true
fundamental_package.workspace = true
tempfile.workspace = true
fundamental_local.workspace = true
fundamental_encryption.workspace = true
time.workspace = true
fundamental_dev.workspace = true
clap.workspace = true
console.workspace = true
dialoguer.workspace = true
syn.workspace = true
toml_edit.workspace = true
serde_json.workspace = true
roxmltree.workspace = true
fundamental_bench.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

