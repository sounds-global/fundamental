name: native

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: native surfaces (${{ matrix.os }})
    strategy:
      # One OS's failure must not hide another's.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # The keychain test asks `cargo tree --offline` about the whole workspace.
      - run: cargo fetch --locked

      - name: system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev librsvg2-dev libxdo-dev \
            libayatana-appindicator3-dev libdbus-1-dev libudev-dev libssl-dev pkg-config \
            libtss2-dev swtpm dbus gnome-keyring

      - name: the client identity, in a real TLS handshake
        run: cargo test -p fundamental_native --features client-identity --test client_identity

      - name: the device key and its certificate request
        if: runner.os != 'Linux'
        run: cargo test -p fundamental_keys --features client-identity

      # GitHub's image runs no Secret Service; the keyring test needs an unlocked gnome-keyring.
      - name: the device key and its certificate request (Linux, against gnome-keyring)
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- sh -c 'printf ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null && cargo test -p fundamental_keys --features client-identity'

      - name: the device key in a TPM, against swtpm
        if: runner.os == 'Linux'
        run: cargo test -p fundamental_keys --features client-tpm --test tpm_device_key
