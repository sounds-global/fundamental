[profile.release]
default-filter = 'all()'
retries = 0
test-threads = "num-cpus"
slow-timeout = { period = "120s", terminate-after = 3 }
fail-fast = false

[profile.agent.junit]
path = "junit.xml"

[profile.ci]
default-filter = 'all()'
retries = 0
test-threads = "num-cpus"
slow-timeout = { period = "120s", terminate-after = 3 }
failure-output = "immediate-final"
fail-fast = false

# YugabyteDB catalog writes are cluster-wide; more at once fail with `40001`.
[test-groups]
store-fixtures = { max-threads = 4 }
# Cargo locks its target directory; concurrent builds only wait.
cargo-builds = { max-threads = 1 }
# More Chromiums at once push a page's first answer past a test's wait.
browsers = { max-threads = 4 }

# Bounded for a cold build.
[[profile.default.overrides]]
filter = '(package(fundamental_cli) and (binary(generate) or binary(new)) and (test(~compiles) or test(~builds))) or binary(compile_fail) or (package(fundamental_build) and binary(fixture_builds))'
test-group = 'cargo-builds'
slow-timeout = { period = "120s", terminate-after = 10 }

[[profile.default.overrides]]
filter = 'package(fundamental_sql) or package(fundamental_cql) or package(fundamental_authz) or package(fundamental_db_migrator) or package(fundamental_sync_server) or package(fundamental_nats) or package(fundamental_sync)'
test-group = 'store-fixtures'

[[profile.ci.overrides]]
filter = '(package(fundamental_cli) and (binary(generate) or binary(new)) and (test(~compiles) or test(~builds))) or binary(compile_fail) or (package(fundamental_build) and binary(fixture_builds))'
test-group = 'cargo-builds'
slow-timeout = { period = "120s", terminate-after = 10 }

[[profile.ci.overrides]]
filter = 'package(fundamental_sql) or package(fundamental_cql) or package(fundamental_authz) or package(fundamental_db_migrator) or package(fundamental_sync_server) or package(fundamental_nats) or package(fundamental_sync)'
test-group = 'store-fixtures'

[[profile.default.overrides]]
filter = '(package(fundamental_test_browser) and binary(a_page_is_driven_and_recorded))'
test-group = 'browsers'

[[profile.ci.overrides]]
