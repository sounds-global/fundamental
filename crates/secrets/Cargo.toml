[package]
name = "fundamental_secrets"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "HashiCorp Vault client for the Fundamental framework: dynamic leased database credentials, lease renewal, and Transit key operations."

[features]
transit-signer = ["dep:fundamental_keys"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
fundamental_core.workspace = true
fundamental_config.workspace = true
fundamental_macros.workspace = true
reqwest = { workspace = true, features = ["query"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
base64.workspace = true
bytes.workspace = true
parking_lot.workspace = true
zeroize.workspace = true
subtle.workspace = true
arc-swap.workspace = true
# Optional: the store drivers that use this crate link no more of fundamental_keys than they need.
fundamental_keys = { workspace = true, optional = true }

[dev-dependencies]
fundamental_test_containers = { workspace = true, features = ["openbao"] }
fundamental_secrets = { path = ".", features = ["transit-signer"] }
uuid = { workspace = true, features = ["v4"] }
tracing.workspace = true
tracing-subscriber.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
