[package]
name = "fundamental_schema"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Structural type reflection for the Fundamental framework: a native #[derive(Schema)] and a JSON-Schema-2020-12 model that describes serde wire types, feeding OpenAPI/AsyncAPI generation."
keywords = ["schema", "json-schema", "reflection", "openapi", "serde"]
categories = ["encoding", "web-programming", "data-structures"]

[lib]
bench = false

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
chrono = { workspace = true }
fundamental_core.workspace = true
fundamental_macros.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

[dev-dependencies]
serde_json.workspace = true
