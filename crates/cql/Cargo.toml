[package]
name = "fundamental_cql"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "YugabyteDB (YCQL) adapter for the Fundamental framework: wide-column persistence implementing the fundamental_db traits for high-throughput data."

[lib]
bench = false

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
fundamental_db.workspace = true
fundamental_core = { workspace = true, features = ["chrono"] }
fundamental_config.workspace = true
fundamental_macros.workspace = true
fundamental_sync.workspace = true
scylla.workspace = true
async-trait.workspace = true
futures.workspace = true
rustls.workspace = true
tracing.workspace = true
tokio.workspace = true
rustc-hash.workspace = true
prometheus.workspace = true
uuid = { workspace = true, features = ["v4"] }
fundamental_encryption.workspace = true
fundamental_secrets.workspace = true
arc-swap.workspace = true
serde_json.workspace = true
chrono.workspace = true

[dev-dependencies]
fundamental_cql = { path = ".", features = ["test-support"] }
fundamental_test_containers = { workspace = true, features = ["cql"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util", "sync"] }
uuid = { workspace = true, features = ["v4", "v1"] }
tracing-subscriber.workspace = true
tracing-test = { workspace = true, features = ["no-env-filter"] }
trybuild.workspace = true
criterion.workspace = true

[features]
internal-benches = []
# Never enabled in a release build.
test-support = ["fundamental_db/ephemeral"]

[[bench]]
name = "query_build"
harness = false
required-features = ["internal-benches"]

[[bench]]
name = "translations"
harness = false
required-features = ["internal-benches"]
