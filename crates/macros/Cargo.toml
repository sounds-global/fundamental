[package]
name = "fundamental_macros"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Derive macros for the Fundamental framework: Model, Identifier, Error, ErrorOverride, and Validate."

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
proc-macro = true

[dependencies]
fundamental_core.workspace = true
fundamental_i18n_keys.workspace = true
syn.workspace = true
quote.workspace = true
proc-macro2.workspace = true
proc-macro-crate.workspace = true
darling.workspace = true
unicode-normalization.workspace = true

[dev-dependencies]
tempfile = { workspace = true }
fundamental = { workspace = true, features = ["schema", "server", "db"] }
uuid = { workspace = true, features = ["v4", "v7"] }
toml.workspace = true
serde_json.workspace = true
serde.workspace = true
trybuild.workspace = true
