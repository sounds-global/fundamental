[package]
name = "fundamental_sync"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Offline sync for the Fundamental framework: derive an offline mirror table and sync-overlay schema from a #[model(syncable)] server model."
keywords = ["sync", "offline", "database", "replication", "crdt"]
categories = ["database", "asynchronous"]

[lib]
bench = false

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
fundamental_core.workspace = true
fundamental_db.workspace = true
fundamental_macros.workspace = true
fundamental_offline.workspace = true
fundamental_nats = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["sync"] }

[features]
nats = ["dep:fundamental_nats"]

[dev-dependencies]
# Turns on the `nats` feature this crate's own tests are gated on.
fundamental_sync = { path = ".", features = ["nats"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time"] }
fundamental_test_containers = { workspace = true, features = ["nats"] }
fundamental_nats.workspace = true
