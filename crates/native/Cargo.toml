[package]
name = "fundamental_native"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Native (Tauri) surface seam for the Fundamental framework: a swappable ActionBridge that serves webview action calls in-process through Router::dispatch, or against a remote API over HTTP."
keywords = ["tauri", "native", "desktop", "mobile", "bridge"]
categories = ["gui", "asynchronous"]

[lib]
bench = false

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
sync-host = [
    "dep:fundamental_offline",
    "dep:fundamental_sync",
    "dep:fundamental_ws_client",
    "dep:futures",
    "dep:tokio",
]
deep-link = [
    "dep:tauri-plugin-deep-link",
    "dep:tauri-plugin-opener",
    "dep:tauri-plugin-single-instance",
]
push = ["dep:subtle"]
loopback = ["dep:tokio", "dep:subtle", "dep:form_urlencoded"]
client-identity = [
    "dep:fundamental_keys",
    "fundamental_keys/client-identity",
    "dep:rustls",
    "dep:rustls-native-certs",
    "dep:arc-swap",
    "reqwest/cookies",
]

[dependencies]
fundamental_core = { workspace = true, features = ["json"] }
fundamental_macros.workspace = true
fundamental_auth.workspace = true
fundamental_server.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tracing.workspace = true
fundamental_offline = { workspace = true, optional = true }
fundamental_sync = { workspace = true, optional = true }
fundamental_ws_client = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt", "sync", "net", "time", "io-util"], optional = true }
subtle = { workspace = true, optional = true }
form_urlencoded = { workspace = true, optional = true }
uuid = { workspace = true, features = ["v4"] }
reqwest.workspace = true
fundamental_keys = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }
arc-swap = { workspace = true, optional = true }
tauri-plugin-deep-link = { workspace = true, optional = true }
tauri-plugin-opener = { workspace = true, optional = true }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri = { workspace = true, features = ["tray-icon"] }
tauri-plugin-single-instance = { workspace = true, optional = true }

[dev-dependencies]
# Its own features, so the `tests/` gated on them do not compile empty.
fundamental_native = { path = ".", features = ["sync-host", "loopback", "client-identity"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util"] }
serde.workspace = true
serde_json.workspace = true
tracing-test.workspace = true
fundamental_sync_server.workspace = true
fundamental_db.workspace = true
tempfile.workspace = true
fundamental_keys = { workspace = true, features = ["client-identity"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
rustls.workspace = true
x509-cert = { version = "0.2", features = ["builder", "pem"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
der = { version = "0.7", features = ["pem", "alloc"] }
spki = { version = "0.7", features = ["alloc"] }
sha2 = { version = "0.10", features = ["oid"] }
