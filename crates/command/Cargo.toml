[package]
name = "fundamental_command"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Developer-authored commands for the Fundamental framework: a #[command] attribute and a name-dispatched runner over a generic, app-owned context, run by `fun run`."
keywords = ["command", "cli", "task", "runner", "async"]
categories = ["command-line-interface", "asynchronous"]

[lib]
bench = false

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
fundamental_core.workspace = true
fundamental_macros.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing-subscriber.workspace = true
tracing-test = { workspace = true, features = ["no-env-filter"] }
