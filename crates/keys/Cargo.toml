[package]
name = "fundamental_keys"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Device identity for the Fundamental framework: per-device ed25519 keys behind one signer/verifier seam, with platform-native secure storage (OS keychain on desktop, non-extractable WebCrypto in the browser)."
keywords = ["ed25519", "device", "identity", "signature", "wasm"]
categories = ["cryptography", "authentication", "wasm"]

[lib]
bench = false

[features]
hsm = ["dep:cryptoki"]

keys-hd = ["dep:hmac", "dep:sha2", "dep:zeroize", "dep:blake3", "dep:aes-gcm"]

keys-hd-password = ["keys-hd", "dep:argon2"]

client-identity = ["dep:der", "dep:spki", "dep:const-oid", "dep:x509-cert"]
client-tpm = ["client-identity", "dep:tss-esapi", "dep:sha2"]

os-keychain = ["dep:keyring"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
fundamental_core.workspace = true
fundamental_macros.workspace = true
ed25519-dalek.workspace = true
base64.workspace = true
serde.workspace = true
tracing.workspace = true
hmac = { version = "0.12", optional = true }
der = { version = "0.7", features = ["pem", "alloc"], optional = true }
spki = { version = "0.7", features = ["alloc"], optional = true }
const-oid = { version = "0.9", features = ["db"], optional = true }
x509-cert = { version = "0.2", optional = true }
sha2 = { version = "0.10", optional = true }
blake3 = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
aes-gcm = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.2"
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std", "pem", "pkcs8"] }
ring.workspace = true
spki = { version = "0.7", default-features = false, features = ["std", "pem"] }
serde_json.workspace = true
cryptoki = { workspace = true, optional = true }
argon2 = { version = "0.5", optional = true }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { workspace = true, features = ["apple-native-keyring-store"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native-keyring-store"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Pinned exactly: the TPM speaks through the TCG's reference C stack this version wraps.
tss-esapi = { version = "=7.7.0", optional = true }
keyring = { workspace = true, features = ["dbus-secret-service-keyring-store"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
futures.workspace = true
web-sys = { workspace = true, features = [
    "Crypto",
    "SubtleCrypto",
    "CryptoKey",
    "CryptoKeyPair",
    "Window",
    "WorkerGlobalScope",
    "IdbFactory",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbDatabase",
    "IdbObjectStore",
    "IdbTransaction",
    "IdbTransactionMode",
] }

[dev-dependencies]
fundamental_core.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
fundamental_keys = { path = ".", features = ["client-tpm"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test.workspace = true
