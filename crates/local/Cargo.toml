[package]
name = "fundamental_local"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Local origins: every project develops at its real `.test` names over HTTPS — a machine registry of instances and loopback addresses, one resolver routed for `.test` only, a name-constrained root per project and a proved leaf per instance."

[lib]
bench = false

[lints]
workspace = true

[dependencies]
fundamental_core.workspace = true
fundamental_macros.workspace = true
fundamental_manifest.workspace = true
rcgen = { workspace = true, features = ["x509-parser"] }
rustls-webpki.workspace = true
rustls-pki-types.workspace = true
base64.workspace = true
x509-parser.workspace = true
ring.workspace = true
blake3 = { workspace = true, features = ["std"] }
time.workspace = true
rustix.workspace = true
hickory-proto.workspace = true
serde.workspace = true
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
rcgen = { workspace = true, features = ["x509-parser"] }
tracing-test = { workspace = true, features = ["no-env-filter"] }
