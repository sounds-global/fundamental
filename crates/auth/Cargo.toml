[package]
name = "fundamental_auth"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Principal authentication for the Fundamental framework: verify a JWT against configured JWKS into a typed AuthenticatedPrincipal, behind one PrincipalVerifier seam."
keywords = ["auth", "jwt", "jwks", "principal", "authentication"]
categories = ["authentication"]

[lib]
bench = false

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
fundamental_core.workspace = true
fundamental_macros.workspace = true
fundamental_config.workspace = true
fundamental_keys.workspace = true
fundamental_encryption.workspace = true
getrandom.workspace = true
base64.workspace = true
jsonwebtoken.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
reqwest.workspace = true
arc-swap.workspace = true
tokio = { workspace = true, features = ["rt", "time", "sync"] }

[dev-dependencies]
fundamental_observability = { workspace = true, features = ["testing"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std", "pem", "pkcs8"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "net", "io-util"] }
base64.workspace = true
serde_json.workspace = true
jsonwebtoken.workspace = true
tempfile.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
