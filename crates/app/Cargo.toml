[package]
name = "fundamental_app"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "One App value per app: its words, languages, look, addresses, pages, surfaces and document shell, run by one call that owns telemetry, the bundle, the admin listener and the release check."
keywords = ["app", "web", "ssr", "server", "startup"]
categories = ["web-programming"]

[lib]
bench = false

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
introspect = ["dep:fundamental_introspect"]
worker = ["dep:fundamental_nats", "dep:fundamental_secrets", "fundamental_runtime/nats"]
sync = ["dep:fundamental_sync_server", "dep:fundamental_sync", "dep:fundamental_auth", "dep:fundamental_ws", "fundamental_runtime/ws"]
cql = ["dep:fundamental_cql", "dep:fundamental_secrets"]
socket = ["dep:fundamental_ws", "fundamental_runtime/ws"]

[dependencies]
fundamental_api.workspace = true
fundamental_core.workspace = true
fundamental_macros.workspace = true
fundamental_config.workspace = true
fundamental_db.workspace = true
fundamental_i18n.workspace = true
fundamental_observability.workspace = true
fundamental_runtime = { workspace = true, features = ["api", "web"] }
fundamental_server.workspace = true
fundamental_sql.workspace = true
fundamental_web = { workspace = true, features = ["ssr"] }
fundamental_introspect = { workspace = true, optional = true, features = ["ssr"] }
fundamental_ws = { workspace = true, optional = true }
fundamental_nats = { workspace = true, optional = true }
fundamental_secrets = { workspace = true, optional = true }
fundamental_sync_server = { workspace = true, optional = true }
fundamental_sync = { workspace = true, optional = true }
fundamental_auth = { workspace = true, optional = true }
fundamental_cql = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing.workspace = true

[dev-dependencies]
fundamental_app = { path = ".", features = ["socket", "worker", "sync", "cql"] }
fundamental_sync_server.workspace = true
fundamental_ws.workspace = true
fundamental_nats.workspace = true
serde = { workspace = true, features = ["derive"] }
fundamental_core.workspace = true
leptos = { workspace = true, features = ["islands"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
