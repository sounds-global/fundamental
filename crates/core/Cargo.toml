[package]
name = "fundamental_core"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core traits and marker types for the Fundamental framework: Model, Error, Validate, and sealed database-affinity markers. Zero runtime dependencies, no_std-capable."

[lib]
bench = false

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
serde.workspace = true
uuid.workspace = true
chrono = { workspace = true, optional = true }
regex.workspace = true
zeroize.workspace = true
proptest = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
fundamental_i18n_keys = { workspace = true, optional = true }
deunicode = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
listenfd = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser's `crypto.getRandomValues`, declared here rather than left to feature unification.
getrandom = { workspace = true, optional = true, features = ["js"] }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
criterion.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time"] }
subtle = { workspace = true }

[features]
chrono = ["dep:chrono"]
default = ["std"]
std = ["dep:fundamental_i18n_keys", "dep:tracing", "dep:listenfd"]
proptest = ["std", "dep:proptest"]
json = ["dep:serde_json"]
retry = ["std", "dep:getrandom", "dep:tracing"]
seeded-entropy = ["retry"]
slug-proposal = ["dep:deunicode"]

[[bench]]
name = "validation"
harness = false

[[bench]]
name = "secrets"
harness = false
