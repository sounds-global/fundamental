[package]
name = "fundamental_build"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Framework-neutral build engine for the Fundamental framework: a filesystem `pages/` scanner producing a route-tree IR plus typed link builders, and `migrations/`/`seeds/` discovery."
keywords = ["build", "routing", "filesystem", "codegen", "scanner"]
categories = ["development-tools", "web-programming"]

[lib]
bench = false

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
fundamental_core.workspace = true
fundamental_macros.workspace = true
syn = { workspace = true, features = ["visit"] }
quote.workspace = true
proc-macro2 = { workspace = true, features = ["span-locations"] }
tracing.workspace = true
fundamental_manifest = { workspace = true, features = ["ledger"] }
toml.workspace = true
serde.workspace = true
sha2 = "0.10"

[dev-dependencies]
tempfile.workspace = true
