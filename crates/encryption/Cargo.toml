[package]
name = "fundamental_encryption"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Field-level encryption for the Fundamental framework: versioned keys, key rotation, and pluggable KMS backends (Vault Transit, local envelopes)."

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
fundamental_core.workspace = true
fundamental_macros.workspace = true
fundamental_config.workspace = true
fundamental_secrets.workspace = true
zeroize.workspace = true
ring.workspace = true
async-trait.workspace = true
chacha20poly1305 = { workspace = true, features = ["stream"] }
blake3 = { workspace = true, features = ["zeroize"] }
subtle.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
tracing-subscriber.workspace = true
tracing-test.workspace = true
fundamental_test_containers = { workspace = true, features = ["openbao"] }
uuid = { workspace = true, features = ["v4"] }
