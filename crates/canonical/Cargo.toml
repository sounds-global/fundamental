[package]
name = "fundamental_canonical"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Canonical bytes for the Fundamental framework: a strict RFC 8785 (JCS) reader that accepts only bytes already in canonical form, a canonical writer, and typed content and context digests."
keywords = ["jcs", "rfc8785", "canonical-json", "digest", "i-json"]
categories = ["encoding", "cryptography", "parser-implementations"]

[lib]
bench = false

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
# Off by default: a verifier must never refuse what a newer Unicode registry accepted.
registry = ["dep:icu_normalizer", "dep:icu_properties"]

[dependencies]
fundamental_core.workspace = true
fundamental_macros.workspace = true
serde.workspace = true
sha2 = { version = "0.10", default-features = false }
blake3.workspace = true
base64.workspace = true
subtle.workspace = true
zeroize.workspace = true
# Pinned exactly: `UnicodeData::REGISTRY` names the Unicode version these tables carry.
icu_normalizer = { version = "=2.3.0", optional = true }
icu_properties = { version = "=2.3.0", optional = true }

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
proptest.workspace = true
