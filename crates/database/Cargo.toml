[package]
name = "fundamental_db"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Abstract, compile-time-safe database traits for the Fundamental framework: repositories, transactions, queries, and model-driven migrations."

[lib]
bench = false

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
fundamental_core.workspace = true
fundamental_macros.workspace = true
chrono.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
hdrhistogram.workspace = true
parking_lot.workspace = true
blake3.workspace = true
fundamental_manifest.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true
tracing-test.workspace = true
criterion.workspace = true
# Dev-only: the library is runtime-neutral, so tokio is never a normal dependency.
tokio = { workspace = true, features = ["rt", "macros"] }

[features]
default = ["std"]
std = []
# Never enabled by a shipping crate: `uuid/v4` pulls `getrandom`, which breaks the wasm build.
ephemeral = ["uuid/v4"]

[[bench]]
name = "ident"
harness = false

[[bench]]
name = "schema_diff"
harness = false
