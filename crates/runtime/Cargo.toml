[package]
name = "fundamental_runtime"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Surface supervisor for the Fundamental framework: runs one or more surfaces (NATS worker, WebSocket server, ...) under one shutdown signal with an ordered drain and a unified error."
keywords = ["runtime", "supervisor", "shutdown", "async", "tokio"]
categories = ["asynchronous"]

[lib]
bench = false

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
fundamental_core.workspace = true
fundamental_macros.workspace = true
tokio = { workspace = true }
tracing.workspace = true

fundamental_nats = { workspace = true, optional = true }
fundamental_ws = { workspace = true, optional = true }
fundamental_api = { workspace = true, optional = true }
fundamental_server = { workspace = true, optional = true }
fundamental_config = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
fundamental_web = { workspace = true, optional = true }
fundamental_db = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }

[dev-dependencies]
fundamental_runtime = { path = ".", features = ["ws"] }
fundamental_ws = { workspace = true, features = ["test-support"] }
futures.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tempfile.workspace = true
tokio-tungstenite.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
tracing-subscriber.workspace = true
tracing-test = { workspace = true, features = ["no-env-filter"] }

[features]
default = []
nats = ["dep:fundamental_nats"]
ws = ["dep:fundamental_ws"]
api = [
    "dep:fundamental_api",
    "dep:fundamental_server",
    "dep:fundamental_config",
    "dep:serde",
]
web = ["dep:fundamental_web", "fundamental_web/ssr"]
db = ["dep:fundamental_db", "dep:chrono"]
